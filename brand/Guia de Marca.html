document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n  <\u002Fdiv>\n\n  <div style=\"max-width:1280px;margin:0 auto;padding:0 28px\">\n\n    <div style=\"padding:80px 0;border-bottom:1px solid rgba(255,255,255,0.07)\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px\">\n        <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#00e0ff\">01<\u002Fspan>\n        <h2 style=\"font:700 26px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.015em\">As cinco constantes<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font:400 14px/1.6 'Sora',sans-serif;color:#8b93a1;margin:0 0 30px;max-width:620px\">Tudo o mais pode variar. Se estes cinco pontos estiverem certos, qualquer peça gerada automaticamente é reconhecível como Seu Canal.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px\">\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:9px\">\n          <span style=\"font:600 11px 'IBM Plex Mono',monospace;color:#39ff88\">01<\u002Fspan>\n          <span style=\"font:600 15px 'Space Grotesk',sans-serif\">Escuridão total<\u002Fspan>\n          <span style=\"font:400 13px/1.55 'Sora',sans-serif;color:#8b93a1\">Fundo quase-preto em 100% das peças. Nunca claro, nunca colorido.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:9px\">\n          <span style=\"font:600 11px 'IBM Plex Mono',monospace;color:#39ff88\">02<\u002Fspan>\n          <span style=\"font:600 15px 'Space Grotesk',sans-serif\">Um único sinal<\u002Fspan>\n          <span style=\"font:400 13px/1.55 'Sora',sans-serif;color:#8b93a1\">Uma só cor neon por peça. Verde padrão, ciano para ruptura.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-ra o · legendas · descrição<br>nunca abaixo de 13px<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:80px 0;border-bottom:1px solid rgba(255,255,255,0.07)\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px\">\n        <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#00e0ff\">04<\u002Fspan>\n        <h2 style=\"font:700 26px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.015em\">O perfil<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font:400 14px/1.6 'Sora',sans-serif;color:#8b93a1;margin:0 0 30px;max-width:620px\">O @ permanece: <strong style=\"color:#c7cdd6;font-weight:600\">@seucanal<\u002Fstrong> já carrega histórico e busca. O que muda é o nome de exibição, a bio e a foto.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\">\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px\">\n          <div style=\"width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#161a21,#0a0a0c 72%);border:1px solid rgba(57,255,136,0.3);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"46\" sc-camel-view-box=\"0 0 120 56\"><path d=\"M20 44 L20 12 M100 12 L100 44 M40 40 L48 16 L56 40 M64 16 L64 40 M72 16 L80 40 L88 16\" fill=\"none\" stroke=\"#39ff88\" stroke-width=\"4.6\" stroke-linecap=\"square\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font:700 19px 'Space Grotesk',sans-serif\">Seu Canal<\u002Fdiv>\n          <div style=\"font:500 13px 'IBM Plex Mono',monospace;color:#8b93a1\">@seucanal<\u002Fdiv>\n          <div style=\"display:flex;gap:26px;margin:6px 0\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:700 x-wrap:wrap;gap:9px;margin-bottom:26px\">\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ p.select }}\" style=\"{{ p.chipStyle }}\">{{ p.tag }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;align-items:start\">\n        <div style=\"display:flex;justify-content:center\">\n          <div style=\"width:100%;max-width:300px;aspect-ratio:9/16;border-radius:14px;border:1px solid rgba(255,255,255,0.1);position:relative;overflow:hidden;background:#0a0a0c;display:flex;flex-direction:column;justify-content:space-between;padding:22px\">\n            <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.035) 1px,transparent 1px);background-size:100% 7px\"><\u002Fdiv>\n            <div style=\"position:absolute;inset:0;background:{{ sel.glow }}\"><\u002Fdiv>\n            <div style=\"position:relative;display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"{{ sel.tagStyle }}\">{{ sel.tag }}<\u002Fspan>\n              <svg width=\"20\" sc-camel-view-box=\"0 0 120 56\"><path d=\"M20 44 L20 12 M100 12 L100 44 M40 40 L48 16 L56 40 M64 16 L64 40 M72 16 L80 40 L88 16\" fill=\"none\" stroke=\"rgba(233,238,241,0.45)\" stroke-width=\"7\" stroke-linecap=\"square\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"position:relative;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"width:34px;height:2px;background:{{ sel.accent }}\"><\u002Fdiv>\n              <div style=\"font:700 22px/1.18 'Space Grotesk',sans-serif;letter-spacing:-0.02em;color:#e9eef1;text-wrap:pretty\">{{ sel.exemplo }}<\u002Fdiv>\n              <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#98a1af\">@AICENTRALBR · {{ sel.duracao }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:22px\">\n            <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:10px\">FÓRMULA DO GANCHO<\u002Fdiv>\n            <div style=\"font:600 16px/1.45 'Space Grotesk',sans-serif;color:#e9eef1\">{{ sel.formula }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:22px\">\n            <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:14px\">ESTRUTURA<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ sel.beats }}\" as=\"beat\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:12px;align-items:flex-start\">\n                  <span style=\"font:600 11px 'IBM Plex Mono',monospace;color:#39ff88;padding-top:3px\">{{ beat.n }}<\u002Fspan>\n                  <span style=\"font:400 13.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">{{ beat.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n            <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px\">\n              <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:9px\">MOTIVO VISUAL<\u002Fdiv>\n              <div style=\"font:400 13.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">{{ sel.visual }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px\">\n              <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:9px\">FECHAMENTO<\u002Fdiv>\n              <div style=\"font:400 13.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">{{ sel.cta }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:80px 0;border-bottom:1px solid rgba(255,255,255,0.07)\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px\">\n        <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#00e0ff\">06<\u002Fspan>\n        <h2 style=\"font:700 26px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.015em\">Apresentadores sintéticos<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font:400 14px/1.6 'Sora',sans-serif;color:#98a1af;margin:0 0 30px;max-width:660px\">Dois avatares brasileiros para os formatos explicativos — o vídeo continua rodando ao fundo, o avatar apenas conduz. Eles são <strong style=\"color:#c7cdd6;font-weight:600\">elenco, não a marca<\u002Fstrong>: aparecem em Análise, Como fazer e Fato; nunca na foto de perfil, nunca na capa.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:20px\">\n\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"display:grid;grid-template-columns:132px 1fr;gap:20px;padding:24px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.07)\">\n            <div style=\"width:132px;height:176px;border-radius:12px;overflow:hidden;background:#0a0a0c;border:1px solid rgba(57,255,136,0.22)\">\n              <image-slot id=\"avatar-iris\" shape=\"rect\" src=\"ae3270c3-f044-429a-8b37-f313fb86f1ee\" placeholder=\"Solte aqui o render final da Íris\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <span style=\"font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.12em;color:#39ff88\">APRESENTADORA · A<\u002Fspan>\n              <span style=\"font:700 26px/1 'Space Grotesk',sans-serif;letter-spacing:-0.02em\">ÍRIS<\u002Fspan>\n              <span style=\"font:400 13px/1.5 'Sora',sans-serif;color:#c7cdd6\">Conduz notícia e análise. Precisa, contida, levemente cética — quem entrega a informação antes de você pedir contexto.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:16px;flex:1\">\n            <div>\n              <div style=\"font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:10px\">FICHA FÍSICA — TRAVADA<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;font:400 13px/1.5 'Sora',sans-serif;color:#c7cdd6\">\n                <div>Mulher brasileira, 29 anos, pele parda média, traços miscigenados suaves.<\u002Fdiv>\n                <div>Cabelo castanho-escuro ondulado, preso baixo, fios soltos na têmpora.<\u002Fdiv>\n                <div>Olhos castanho-escuros, sobrancelhas marcadas, sem maquiagem aparente.<\u002Fdiv>\n                <div>Gola alta preta lisa, sem estampa, sem joia, sem logotipo.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:10px\">VOZ<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">pt-BR neutro<\u002Fspan>\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">médio-grave<\u002Fspan>\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">ritmo 0,95×<\u002Fspan>\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">pausa após o gancho<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#07080a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin-top:auto\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n                <span style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">PROMPT DE IDENTIDADE · IMUTÁVEL<\u002Fspan>\n                <button sc-camel-on-click=\"{{ copyIris }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#98a1af;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblIris }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:15px;font:400 11.5px/1.7 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ irisPrompt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"display:grid;grid-template-columns:132px 1fr;gap:20px;padding:24px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.07)\">\n            <div style=\"width:132px;height:176px;border-radius:12px;overflow:hidden;background:#0a0a0c;border:1px solid rgba(0,224,255,0.22)\">\n              <image-slot id=\"avatar-theo\" shape=\"rect\" src=\"44089c4e-5635-4e25-bd6f-11e4538f856b\" placeholder=\"Solte aqui o render final do Théo\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <span style=\"font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.12em;color:#00e0ff\">APRESENTADOR · B<\u002Fspan>\n              <span style=\"font:700 26px/1 'Space Grotesk',sans-serif;letter-spacing:-0.02em\">THÉO<\u002Fspan>\n              <span style=\"font:400 13px/1.5 'Sora',sans-serif;color:#c7cdd6\">Conduz tutorial e comparação. Didático, direto, sem entusiasmo forçado — explica como quem já testou.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:16px;flex:1\">\n            <div>\n              <div style=\"font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:10px\">FICHA FÍSICA — TRAVADA<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;font:400 13px/1.5 'Sora',sans-serif;color:#c7cdd6\">\n                <div>Homem brasileiro, 34 anos, pele parda clara, traços miscigenados.<\u002Fdiv>\n                <div>Cabelo preto curto penteado para trás, barba curta aparada.<\u002Fdiv>\n                <div>Olhos castanho-escuros, expressão neutra, sem sorriso de catálogo.<\u002Fdiv>\n                <div>Camiseta preta lisa de gola redonda, sem estampa, sem acessório.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:10px\">VOZ<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">pt-BR neutro<\u002Fspan>\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">grave<\u002Fspan>\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">ritmo 1,0×<\u002Fspan>\n                <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#c7cdd6;border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:5px 11px\">ênfase nos números<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#07080a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin-top:auto\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n                <span style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#00e0ff\">PROMPT DE IDENTIDADE · IMUTÁVEL<\u002Fspan>\n                <button sc-camel-on-click=\"{{ copyTheo }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#98a1af;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#00e0ff;border-color:#00e0ff\">{{ lblTheo }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:15px;font:400 11.5px/1.7 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ theoPrompt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px\">\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:8px\">COMPOSIÇÃO NO QUADRO 9:16<\u002Fdiv>\n          <p style=\"font:400 12.5px/1.55 'Sora',sans-serif;color:#98a1af;margin:0 0 18px\">O avatar nunca é o assunto. Recorte sem fundo, encostado na borda, ocupando um terço da altura.<\u002Fp>\n          <div style=\"display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap\">\n            <div style=\"width:150px;aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:#0a0a0c;position:relative;overflow:hidden;flex:none\">\n              <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(135deg,#0a0a0c,#0a0a0c 9px,#101318 9px,#101318 18px)\"><\u002Fdiv>\n              <div style=\"position:absolute;left:10px;top:10px;font:600 8px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">TAG<\u002Fdiv>\n              <div style=\"position:absolute;left:0;right:0;top:12%;height:1px;background:rgba(255,255,255,0.1)\"><\u002Fdiv>\n              <div style=\"position:absolute;left:0;right:0;bottom:34%;height:1px;background:rgba(57,255,136,0.5)\"><\u002Fdiv>\n              <div style=\"position:absolute;right:8px;bottom:0;width:44%;height:34%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(57,255,136,0.22),rgba(57,255,136,0.06));border:1px dashed rgba(57,255,136,0.5);border-bottom:none;display:flex;align-items:center;justify-content:center;text-align:center\">\n                <span style=\"font:600 7.5px/1.3 'IBM Plex Mono',monospace;color:#39ff88\">AVATAR<br>33%<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:absolute;left:10px;bottom:15%;width:44%;font:700 9px/1.15 'Space Grotesk',sans-serif;color:#e9eef1\">Texto na tela fica sempre do lado oposto<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;flex:1;min-width:150px\">\n              <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#39ff88;padding-top:2px\">01<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Altura de 30–36% do quadro, alinhado à direita, cortado no peito.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#39ff88;padding-top:2px\">02<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Fundo removido. Nunca caixa, nunca círculo, nunca moldura.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#39ff88;padding-top:2px\">03<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Luz de recorte verde no ombro, casando com o acento da peça.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#39ff88;padding-top:2px\">04<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Sai de cena nos 3 últimos segundos — o fechamento é só texto.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:24px\">\n          <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#98a1af;margin-bottom:8px\">TRAVAS DE CONSISTÊNCIA<\u002Fdiv>\n          <p style=\"font:400 12.5px/1.55 'Sora',sans-serif;color:#98a1af;margin:0 0 18px\">O que garante que o rosto do vídeo 200 seja o mesmo do vídeo 1.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#00e0ff;padding-top:3px;flex:none\">SEED<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Um seed fixo por avatar, gravado no brand.json. Nunca aleatório.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#00e0ff;padding-top:3px;flex:none\">REF<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">3 retratos mestres (frontal, 3/4, perfil) sempre passados como referência de rosto.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#00e0ff;padding-top:3px;flex:none\">BASE<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">O prompt de identidade entra inteiro e sem edição em toda geração.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#00e0ff;padding-top:3px;flex:none\">VAR<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Só três variáveis mudam por vídeo: ângulo, expressão e gesto. Mais que isso, o rosto deriva.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"font:600 10px 'IBM Plex Mono',monospace;color:#00e0ff;padding-top:3px;flex:none\">QA<\u002Fspan><span style=\"font:400 12.5px/1.5 'Sora',sans-serif;color:#c7cdd6\">Compare cada render com o retrato mestre antes de publicar. Divergiu, descarta.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n            <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">VARIAÇÃO POR VÍDEO · AS 3 VARIÁVEIS<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copyAvatarVar }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#98a1af;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblAvatarVar }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:18px;font:400 12.5px/1.75 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ avatarVarPrompt }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n            <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#ff5a6b\">AVATAR · PROMPT NEGATIVO<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copyAvatarNeg }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#98a1af;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblAvatarNeg }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:18px;font:400 12.5px/1.75 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ avatarNegPrompt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:20px;background:rgba(255,90,107,0.05);border:1px solid rgba(255,90,107,0.22);border-radius:14px;padding:20px 22px\">\n        <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#ff5a6b;margin-bottom:12px\">LIMITES DE USO<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font:400 13px/1.5 'Sora',sans-serif;color:#c7cdd6\">\n          <div>Íris e Théo são personagens sintéticos. Não devem se parecer com nenhuma pessoa real, pública ou privada.<\u002Fdiv>\n          <div>Nunca aparecem na foto de perfil, no logo ou como assinatura do canal — a marca continua sem rosto.<\u002Fdiv>\n          <div>Nunca afirmam ser humanos. Se o roteiro tocar no assunto, assumem que são gerados por IA.<\u002Fdiv>\n          <div>Fora dos formatos Análise, Como fazer, Fato e VS, o vídeo roda sem avatar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showAgent }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:80px 0;border-bottom:1px solid rgba(255,255,255,0.07)\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px\">\n          <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#00e0ff\">07<\u002Fspan>\n          <h2 style=\"font:700 26px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.015em\">Prompts dos agentes<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font:400 14px/1.6 'Sora',sans-serif;color:#8b93a1;margin:0 0 30px;max-width:620px\">Cole estes blocos direto na sua automação. As chaves entre <span style=\"font-family:'IBM Plex Mono',monospace;color:#39ff88\">{ }<\u002Fspan> são as únicas variáveis que o agente preenche por vídeo.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px\">\n          <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n              <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">IMAGEM · PROMPT BASE<\u002Fspan>\n              <button sc-camel-on-click=\"{{ copyImg }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#8b93a1;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblImg }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:18px;font:400 12.5px/1.75 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ imgPrompt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n              <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#ff5a6b\">IMAGEM · PROMPT NEGATIVO<\u002Fspan>\n              <button sc-camel-on-click=\"{{ copyNeg }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#8b93a1;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblNeg }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:18px;font:400 12.5px/1.75 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ negPrompt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n              <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">ROTEIRO · SYSTEM PROMPT<\u002Fspan>\n              <button sc-camel-on-click=\"{{ copyVoice }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#8b93a1;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblVoice }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:18px;font:400 12.5px/1.75 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ voicePrompt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#0e1015;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07)\">\n              <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#00e0ff\">LEGENDA E HASHTAGS<\u002Fspan>\n              <button sc-camel-on-click=\"{{ copyCap }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#8b93a1;background:transparent;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:5px 10px;cursor:pointer\" style-hover=\"color:#39ff88;border-color:#39ff88\">{{ lblCap }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding:18px;font:400 12.5px/1.75 'IBM Plex Mono',monospace;color:#c7cdd6;white-space:pre-wrap\">{{ capPrompt }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:80px 0;border-bottom:1px solid rgba(255,255,255,0.07)\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px\">\n          <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#00e0ff\">08<\u002Fspan>\n          <h2 style=\"font:700 26px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.015em\">brand.json<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font:400 14px/1.6 'Sora',sans-serif;color:#8b93a1;margin:0 0 26px;max-width:620px\">A marca inteira em formato legível por máquina. Guarde como arquivo fixo no seu fluxo e injete em todo prompt de geração.<\u002Fp>\n        <div style=\"background:#07080a;border:1px solid rgba(57,255,136,0.2);border-radius:14px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.07);background:#0c0e12\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"width:8px;height:8px;border-radius:50%;background:#39ff88;display:inline-block\"><\u002Fspan>\n              <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#8b93a1\">seucanal / brand.json<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ copyJson }}\" style=\"font:600 10px 'IBM Plex Mono',monospace;letter-spacing:0.08em;color:#0a0a0c;background:#39ff88;border:none;border-radius:5px;padding:6px 12px;cursor:pointer\" style-hover=\"background:#00e0ff\">{{ lblJson }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px;font:400 12px/1.65 'IBM Plex Mono',monospace;color:#9fe8c0;white-space:pre-wrap;overflow-x:auto;max-height:520px;overflow-y:auto\">{{ brandJson }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:80px 0 100px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px\">\n        <span style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;color:#00e0ff\">09<\u002Fspan>\n        <h2 style=\"font:700 26px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.015em\">Conformidade visual<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font:400 14px/1.6 'Sora',sans-serif;color:#8b93a1;margin:0 0 30px;max-width:620px\">Referência rápida para revisar o que a automação gerou. Se a peça parecer com a fileira de baixo, descarte e regenere.<\u002Fp>\n\n      <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88;margin-bottom:14px\">DENTRO DA MARCA<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(57,255,136,0.25);background:#0a0a0c;position:relative;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n            <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 70% 20%,rgba(57,255,136,0.16),transparent 70%)\"><\u002Fdiv>\n            <div style=\"position:relative;font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">IA NEWS<\u002Fdiv>\n            <div style=\"position:relative;font:700 14px/1.15 'Space Grotesk',sans-serif;letter-spacing:-0.02em\">Um modelo aprendeu a se corrigir sozinho<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Um acento, muito vazio, texto curto.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(0,224,255,0.25);background:#0a0a0c;position:relative;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n            <div style=\"position:absolute;left:0;right:0;top:46%;height:1px;background:#00e0ff\"><\u002Fdiv>\n            <div style=\"position:relative;font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#00e0ff\">VS<\u002Fdiv>\n            <div style=\"position:relative;font:700 14px/1.15 'Space Grotesk',sans-serif;letter-spacing:-0.02em\">Dois modelos, uma tarefa, um mentiu<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Divisão geométrica simples em ciano.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:repeating-linear-gradient(0deg,#0a0a0c,#0a0a0c 6px,#0d1014 6px,#0d1014 7px);position:relative;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:space-between\">\n            <div style=\"position:relative;font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#39ff88\">2030<\u002Fdiv>\n            <div style=\"position:relative;font:700 14px/1.15 'Space Grotesk',sans-serif;letter-spacing:-0.02em\">Você não vai mais escolher o que assiste<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Textura técnica discreta, sem imagem.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:#0a0a0c;position:relative;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:flex-end\">\n            <div style=\"position:absolute;top:0;bottom:0;left:26%;width:1px;background:linear-gradient(180deg,transparent,rgba(57,255,136,0.6),transparent)\"><\u002Fdiv>\n            <div style=\"position:relative;font:700 14px/1.15 'Space Grotesk',sans-serif;letter-spacing:-0.02em\">O dado que ninguém mostrou ainda<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Luz única vertical como único elemento.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.1em;color:#ff5a6b;margin-bottom:14px\">FORA DA MARCA — DESCARTAR<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,90,107,0.35);background:linear-gradient(140deg,#7b2ff7,#f107a3);position:relative;overflow:hidden;padding:14px;display:flex;align-items:flex-end\">\n            <div style=\"font:700 14px/1.15 'Space Grotesk',sans-serif;color:#fff\">Gradiente genérico de IA<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Roxo-rosa é a cara de todo canal de IA.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,90,107,0.35);background:#f2f2f0;position:relative;overflow:hidden;padding:14px;display:flex;align-items:flex-end\">\n            <div style=\"font:700 14px/1.15 'Space Grotesk',sans-serif;color:#111\">Fundo claro<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Quebra o contraste do feed escuro.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,90,107,0.35);background:#0a0a0c;position:relative;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px\">\n            <div style=\"display:flex;gap:4px;flex-wrap:wrap\">\n              <span style=\"font:600 8px 'IBM Plex Mono',monospace;color:#39ff88;border:1px solid #39ff88;border-radius:4px;padding:2px 5px\">NEWS<\u002Fspan>\n              <span style=\"font:600 8px 'IBM Plex Mono',monospace;color:#00e0ff;border:1px solid #00e0ff;border-radius:4px;padding:2px 5px\">HOT<\u002Fspan>\n              <span style=\"font:600 8px 'IBM Plex Mono',monospace;color:#ffb800;border:1px solid #ffb800;border-radius:4px;padding:2px 5px\">TOP<\u002Fspan>\n              <span style=\"font:600 8px 'IBM Plex Mono',monospace;color:#ff5a6b;border:1px solid #ff5a6b;border-radius:4px;padding:2px 5px\">URGENTE<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font:700 12px/1.1 'Space Grotesk',sans-serif;color:#e9eef1\">Texto longo demais competindo com quatro cores ao mesmo tempo na tela<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Poluição: múltiplos acentos e excesso de texto.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <div style=\"aspect-ratio:9/16;border-radius:10px;border:1px solid rgba(255,90,107,0.35);background:#1c1a24;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center\">\n            <div style=\"width:64%;aspect-ratio:1;border-radius:50%;background:repeating-linear-gradient(45deg,#3a3550,#3a3550 6px,#46405e 6px,#46405e 12px);display:flex;align-items:center;justify-content:center;text-align:center\">\n              <span style=\"font:400 9px/1.3 'IBM Plex Mono',monospace;color:#b9b2d6;padding:8px\">placeholder<br>rosto humano<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.45 'Sora',sans-serif;color:#8b93a1\">Canal dark não tem rosto — nunca gere pessoas.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid rgba(255,255,255,0.07);padding:34px 0 60px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <svg width=\"22\" height=\"12\" sc-camel-view-box=\"0 0 120 56\"><path d=\"M20 44 L20 12 M100 12 L100 44 M40 40 L48 16 L56 40 M64 16 L64 40 M72 16 L80 40 L88 16\" fill=\"none\" stroke=\"#98a1af\" stroke-width=\"6\" stroke-linecap=\"square\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#98a1af\">SEU CANAL · @seucanal · VETOR DE MARCA v2.0<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font:500 11px 'IBM Plex Mono',monospace;color:#98a1af\">revisar a cada 90 dias<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bioTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;enigmática&quot;,&quot;provocadora&quot;,&quot;técnica&quot;],&quot;default&quot;:&quot;enigmática&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;},&quot;promptLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt-BR&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt-BR&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Agentes&quot;},&quot;promptDetail&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;detalhado&quot;,&quot;essencial&quot;],&quot;default&quot;:&quot;detalhado&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Agentes&quot;},&quot;showAgentSpecs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Agentes&quot;}}\">\nclass Component extends DCLogic {\n  state = { pillar: 0, copied: null, dl: null };\n\n  copy(key, text) {\n    const flash = ok => {\n      this.setState({ copied: ok ? key : null });\n      if (!ok) return;\n      clearTimeout(this._t);\n      this._t = setTimeout(() => this.setState({ copied: null }), 1600);\n    };\n    const fallback = () => {\n      try {\n        const ta = document.createElement('textarea');\n        ta.value = text;\n        ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';\n        document.body.appendChild(ta);\n        ta.select();\n        const ok = document.execCommand('copy');\n        document.body.removeChild(ta);\n        flash(ok);\n      } catch (e) { flash(false); }\n    };\n    try {\n      const r = navigator.clipboard && navigator.clipboard.writeText(text);\n      if (r && r.then) r.then(() => flash(true), fallback); else fallback();\n    } catch (e) { fallback(); }\n  }\n  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._d); }\n\n  markPath() {\n    return 'M20 44 L20 12 M100 12 L100 44 M40 40 L48 16 L56 40 M64 16 L64 40 M72 16 L80 40 L88 16';\n  }\n\n  markSvg(stroke, width) {\n    const w = width || 1024, h = Math.round(w * 56 / 120);\n    return '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 56\" width=\"' + w + '\" height=\"' + h + '\">' +\n      '<path d=\"' + this.markPath() + '\" fill=\"none\" stroke=\"' + stroke + '\" stroke-width=\"3.4\" stroke-linecap=\"square\"/><\u002Fsvg>';\n  }\n\n  avatarSvg() {\n    return '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 1080\" width=\"1080\" height=\"1080\">' +\n      '<defs><radialGradient id=\"g\" cx=\"34%\" cy=\"28%\" r=\"78%\"><stop offset=\"0\" stop-color=\"#161A21\"/><stop offset=\"1\" stop-color=\"#0A0A0C\"/><\u002FradialGradient><\u002Fdefs>' +\n      '<rect width=\"1080\" height=\"1080\" fill=\"url(#g)\"/>' +\n      '<g transform=\"translate(280 419) scale(4.3333)\">' +\n      '<path d=\"' + this.markPath() + '\" fill=\"none\" stroke=\"#39FF88\" stroke-width=\"3.6\" stroke-linecap=\"square\"/><\u002Fg><\u002Fsvg>';\n  }\n\n  drawMark(ctx, x, y, w, color, lw) {\n    const s = w / 120;\n    ctx.save();\n    ctx.translate(x, y);\n    ctx.scale(s, s);\n    ctx.strokeStyle = color;\n    ctx.lineWidth = lw;\n    ctx.lineCap = 'square';\n    ctx.lineJoin = 'miter';\n    ctx.stroke(new Path2D(this.markPath()));\n    ctx.restore();\n  }\n\n  flashDl(msg) {\n    this.setState({ dl: msg });\n    clearTimeout(this._d);\n    this._d = setTimeout(() => this.setState({ dl: null }), 2400);\n  }\n\n  saveBlob(blob, name) {\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = name;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(url), 4000);\n    this.flashDl('baixado: ' + name);\n  }\n\n  saveSvg(svg, name) {\n    this.saveBlob(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }), name);\n  }\n\n  savePng(name, size, draw) {\n    const c = document.createElement('canvas');\n    c.width = size.w; c.height = size.h;\n    const ctx = c.getContext('2d');\n    draw(ctx);\n    c.toBlob(b => { if (b) this.saveBlob(b, name); else this.flashDl('falha ao gerar PNG'); }, 'image/png');\n  }\n\n  dlAvatarPng() {\n    this.savePng('seucanal-perfil-1080.png', { w: 1080, h: 1080 }, ctx => {\n      const g = ctx.createRadialGradient(367, 302, 60, 540, 540, 820);\n      g.addColorStop(0, '#161A21');\n      g.addColorStop(1, '#0A0A0C');\n      ctx.fillStyle = g;\n      ctx.fillRect(0, 0, 1080, 1080);\n      this.drawMark(ctx, 280, 419, 520, '#39FF88', 3.6);\n    });\n  }\n\n  dlMarkPng() {\n    const w = 1024, h = Math.round(w * 56 / 120), pad = 60;\n    this.savePng('seucanal-simbolo-transparente.png', { w: w + pad * 2, h: h + pad * 2 }, ctx => {\n      this.drawMark(ctx, pad, pad, w, '#39FF88', 3.4);\n    });\n  }\n\n  data() {\n    return [\n      { id: 'news', tag: 'IA NEWS', accent: '#39ff88', duracao: '25–35s',\n        formula: 'Fato duro + consequência imediata + pergunta aberta',\n        exemplo: 'Um modelo aprendeu a se corrigir sozinho. O que quebra primeiro?',\n        beats: ['O fato em uma frase, sem contexto antes', 'Por que isso só foi possível agora', 'O que muda para quem está assistindo'],\n        visual: 'Datacenter em penumbra, uma única linha de luz atravessando', cta: 'Deixa sua aposta nos comentários.' },\n      { id: 'fato', tag: 'FATO', accent: '#00e0ff', duracao: '20–30s',\n        formula: 'Número improvável + comparação física + virada',\n        exemplo: 'Treinar um modelo consome mais energia que 120 casas em um ano.',\n        beats: ['O número que não cabe na cabeça', 'A comparação com algo tangível', 'A virada: e isso ainda vai dobrar'],\n        visual: 'Um objeto isolado flutuando em fundo vazio, luz de recorte', cta: 'Salva para usar numa discussão.' },\n      { id: 'analise', tag: 'ANÁLISE', accent: '#39ff88', duracao: '35–45s',\n        formula: 'Consenso + ruptura + posição do canal',\n        exemplo: 'Dizem que a IA vai criar empregos. Os dados dizem outra coisa.',\n        beats: ['O que todo mundo repete sem checar', 'O furo no argumento, com um dado', 'A posição do canal, sem meio-termo'],\n        visual: 'Duas fontes de luz opostas, contraste duro, sombra longa', cta: 'Discorda? Fala nos comentários.' },\n      { id: 'tutorial', tag: 'COMO FAZER', accent: '#39ff88', duracao: '30–45s',\n        formula: 'Resultado primeiro + três passos numerados',\n        exemplo: 'Três comandos que transformam qualquer IA em pesquisador.',\n        beats: ['Mostra o resultado final logo de cara', 'Passos 1-2-3 em texto na tela', 'O erro comum que anula tudo'],\n        visual: 'Terminal escuro, texto alinhado em grade, zero pessoas', cta: 'Salva antes que suma do feed.' },\n      { id: 'futuro', tag: '2030', accent: '#00e0ff', duracao: '30–40s',\n        formula: 'Data + cenário + o sinal que já existe hoje',\n        exemplo: 'Até 2030 você não escolhe mais o que assiste. Já começou.',\n        beats: ['A previsão sem rodeio, com data', 'O sinal que já está acontecendo', 'O que fazer antes que chegue'],\n        visual: 'Horizonte escuro com uma luz distante, névoa baixa', cta: 'Marca alguém que vai duvidar.' },\n      { id: 'vs', tag: 'VS', accent: '#39ff88', duracao: '30–40s',\n        formula: 'Duelo + um único critério + veredito seco',\n        exemplo: 'Mesma tarefa, dois modelos. Um deles mentiu.',\n        beats: ['Os dois lados apresentados em 5 segundos', 'O teste, sempre um critério só', 'Veredito em uma frase, sem ressalva'],\n        visual: 'Divisão vertical do quadro, duas temperaturas de luz', cta: 'Qual você usaria? Comenta.' }\n    ];\n  }\n\n  bioList() {\n    const items = [\n      { key: 'enigmática', label: 'BIO · ENIGMÁTICA', text: 'Sinais do futuro, decifrados agora. IA e tecnologia, sem ruído.', note: 'Padrão. Reforça o tom misterioso e não promete formato específico.' },\n      { key: 'provocadora', label: 'BIO · PROVOCADORA', text: 'A IA já ultrapassou você. Notícias e previsões sem filtro.', note: 'Mais agressiva, puxa comentário — melhor em fase de crescimento.' },\n      { key: 'técnica', label: 'BIO · DIRETA', text: 'IA e tecnologia explicadas em 30 segundos. Todo dia, sem enrolação.', note: 'Mais clara para quem chega da busca; menos personalidade.' }\n    ];\n    return items.map(b => Object.assign({}, b, { count: b.text.length + '/80' }));\n  }\n\n  prompts() {\n    const en = (this.props.promptLang ?? 'pt-BR') === 'en';\n    const curto = (this.props.promptDetail ?? 'detalhado') === 'essencial';\n    const img = en\n      ? (curto\n        ? 'cinematic still, subject: {assunto}. near-black background #0A0A0C, single neon accent {accent}, high contrast, large negative space, vertical 9:16, no text, no people.'\n        : 'cinematic still, subject: {assunto}.\\nbackground: near-black #0A0A0C, deep shadow, no visible horizon clutter.\\nlighting: single rim light in {accent}, light volumetric haze, high contrast.\\ncomposition: large negative space on the {lado}, subject occupying one third.\\nformat: vertical 9:16, 35mm lens, subtle film grain.\\nno text, no people, no logos, no UI.')\n      : (curto\n        ? 'still cinematográfico, tema: {assunto}. fundo quase-preto #0A0A0C, um único acento neon {accent}, alto contraste, muito espaço vazio, vertical 9:16, sem texto, sem pessoas.'\n        : 'still cinematográfico, tema: {assunto}.\\nfundo: quase-preto #0A0A0C, sombra profunda, sem elementos soltos.\\nluz: um único recorte em {accent}, névoa volumétrica leve, alto contraste.\\ncomposição: grande área vazia à {lado}, objeto ocupando um terço do quadro.\\nformato: vertical 9:16, lente 35mm, grão de filme sutil.\\nsem texto, sem pessoas, sem logotipos, sem interface.');\n    const neg = en\n      ? 'bright background, white or pastel palette, purple-pink AI gradient, smiling stock-photo people, faces, hands, text, watermark, logo, cluttered composition, low contrast, plastic 3D render, cartoon, lens flare overload.'\n      : 'fundo claro, paleta branca ou pastel, gradiente roxo-rosa de IA, pessoas sorrindo de banco de imagens, rostos, mãos, texto, marca d\\'água, logotipo, composição poluída, baixo contraste, render 3D plastificado, cartoon, excesso de flare.';\n    const voice = en\n      ? 'You write scripts for Seu Canal (@seucanal), a faceless tech/AI channel in Brazilian Portuguese.\\nTone: precise and informative, provocative without anger, enigmatic in the hook, futuristic in the close.\\nRules: short sentences; max one number per sentence; never emoji; never \"fala galera\" or \"se inscreva\"; one idea per video; never promise what the video does not deliver.\\nStructure: hook (max 12 words) → context → consequence → one-line close.\\nLength: 25–45s, 70–130 words. Output only the script.'\n      : 'Você escreve roteiros para o Seu Canal (@seucanal), canal dark de tecnologia e IA em pt-BR.\\nTom: informativo e preciso, provocador sem ser raivoso, enigmático no gancho, futurista no fechamento.\\nRegras: frases curtas; no máximo um número por frase; nunca emoji; nunca \"fala galera\" nem \"se inscreva\"; uma ideia por vídeo; nunca prometa o que o vídeo não entrega.\\nEstrutura: gancho (até 12 palavras) → contexto → consequência → fechamento de uma linha.\\nDuração: 25–45s, 70–130 palavras. Devolva apenas o roteiro.';\n    const cap = en\n      ? '{one-line hook, never repeating the audio}\\n{one sentence of context}\\n\\n#ia #inteligenciaartificial #tecnologia #ai #seucanal\\n\\nRules: max 2 lines of copy, 5 hashtags, no emoji, no link.'\n      : '{gancho em uma linha, sem repetir o áudio}\\n{uma frase de contexto}\\n\\n#ia #inteligenciaartificial #tecnologia #ai #seucanal\\n\\nRegras: no máximo 2 linhas de texto, 5 hashtags, sem emoji, sem link.';\n    return { img, neg, voice, cap };\n  }\n\n  avatars() {\n    const en = (this.props.promptLang ?? 'pt-BR') === 'en';\n    const iris = en\n      ? 'ÍRIS — locked identity, never edit.\\nBrazilian woman, 29, medium-brown skin, soft mixed features, dark brown wavy hair tied low with loose strands at the temple, dark brown eyes, strong natural brows, no visible makeup.\\nWardrobe: plain black turtleneck, no print, no jewelry, no logo.\\nLighting: soft cool key from the left, #39FF88 rim light on the right shoulder, near-black #0A0A0C background.\\nFraming: chest-up, 35mm, shallow depth, subtle film grain, photoreal.\\nseed: 481502 · same seed every render.'\n      : 'ÍRIS — identidade travada, não editar.\\nMulher brasileira, 29 anos, pele parda média, traços miscigenados suaves, cabelo castanho-escuro ondulado preso baixo com fios soltos na têmpora, olhos castanho-escuros, sobrancelhas naturais marcadas, sem maquiagem aparente.\\nFigurino: gola alta preta lisa, sem estampa, sem joia, sem logotipo.\\nLuz: chave fria suave à esquerda, recorte #39FF88 no ombro direito, fundo quase-preto #0A0A0C.\\nEnquadramento: do peito para cima, 35mm, profundidade rasa, grão sutil, fotorrealista.\\nseed: 481502 · mesmo seed em toda geração.';\n    const theo = en\n      ? 'THÉO — locked identity, never edit.\\nBrazilian man, 34, light-brown skin, mixed features, short black hair combed back, short trimmed beard, dark brown eyes, neutral expression, no catalogue smile.\\nWardrobe: plain black crew-neck tee, no print, no accessory.\\nLighting: soft cool key from the right, #39FF88 rim light on the left shoulder, near-black #0A0A0C background.\\nFraming: chest-up, 35mm, shallow depth, subtle film grain, photoreal.\\nseed: 907314 · same seed every render.'\n      : 'THÉO — identidade travada, não editar.\\nHomem brasileiro, 34 anos, pele parda clara, traços miscigenados, cabelo preto curto penteado para trás, barba curta aparada, olhos castanho-escuros, expressão neutra, sem sorriso de catálogo.\\nFigurino: camiseta preta lisa de gola redonda, sem estampa, sem acessório.\\nLuz: chave fria suave à direita, recorte #39FF88 no ombro esquerdo, fundo quase-preto #0A0A0C.\\nEnquadramento: do peito para cima, 35mm, profundidade rasa, grão sutil, fotorrealista.\\nseed: 907314 · mesmo seed em toda geração.';\n    const varia = en\n      ? '{identity_prompt}\\n\\nangle: {frontal | three-quarter left | three-quarter right}\\nexpression: {neutral | focused | one raised brow}\\ngesture: {still | slight head tilt | open hand at chest}\\n\\nEverything else stays identical. Never change face, hair, wardrobe, lighting or seed.\\nOutput: cut-out on transparent background, vertical, chest-up.'\n      : '{prompt_de_identidade}\\n\\nângulo: {frontal | 3/4 esquerda | 3/4 direita}\\nexpressão: {neutra | concentrada | uma sobrancelha erguida}\\ngesto: {parada | leve inclinação de cabeça | mão aberta na altura do peito}\\n\\nTodo o resto permanece idêntico. Nunca alterar rosto, cabelo, figurino, luz ou seed.\\nSaída: recorte com fundo transparente, vertical, do peito para cima.';\n    const neg = en\n      ? 'resemblance to any real or public person, celebrity likeness, smiling stock-photo expression, teeth-forward grin, bright or white background, colored gradient backdrop, studio seamless, glasses, hat, jewelry, printed shirt, logo, tattoo, heavy makeup, beauty-filter skin, plastic 3D render, cartoon, anime, extra fingers, distorted hands, text, watermark.'\n      : 'semelhança com pessoa real ou pública, rosto de celebridade, expressão de banco de imagens sorrindo, sorriso aberto com dentes, fundo claro ou branco, fundo com gradiente colorido, ciclorama de estúdio, óculos, chapéu, joia, camisa estampada, logotipo, tatuagem, maquiagem pesada, pele com filtro de beleza, render 3D plastificado, cartoon, anime, dedos a mais, mãos distorcidas, texto, marca d\\'água.';\n    return { iris, theo, varia, neg };\n  }\n\n  json(p, av) {\n    return JSON.stringify({\n      identity: { name: 'Seu Canal', handle: '@seucanal', language: 'pt-BR', format: 'vertical 9:16', mode: 'faceless / automated', tagline: 'Sinais do futuro, decifrados agora.' },\n      voice: { tone: ['informativo', 'provocador', 'enigmático', 'futurista'], sentence_max_words: 18, on_screen_max_words: 12, banned: ['emoji', 'fala galera', 'se inscreva', 'clickbait sem entrega', 'mais de 1 ideia por vídeo'] },\n      palette: { background: '#0A0A0C', surface: '#14171D', ink: '#E9EEF1', muted: '#8B93A1', accent_primary: '#39FF88', accent_secondary: '#00E0FF', rule: 'exatamente 1 acento por peça' },\n      type: { display: 'Space Grotesk 700', mono: 'IBM Plex Mono 500/600', body: 'Sora 400/500' },\n      mark: { concept: 'pulso de dados entre dois pilares', stroke_only: true, colors: ['#39FF88', '#E9EEF1', '#00E0FF'], min_size_px: 28, never: ['preencher', 'inclinar', 'sombra', 'brilho externo'] },\n      imagery: {\n        always: ['fundo quase-preto', 'um único acento neon', 'alto contraste', '50% de espaço vazio', 'motivo técnico: grade, scanline, waveform, terminal'],\n        never: ['pessoas ou rostos', 'fundo claro', 'gradiente roxo-rosa', 'mais de 1 acento', 'texto gerado pela IA na imagem']\n      },\n      pillars: this.data().map(x => ({ id: x.id, tag: x.tag, accent: x.accent, hook_formula: x.formula, duration: x.duracao, visual_motif: x.visual })),\n      presenters: {\n        usage: { formats: ['analise', 'tutorial', 'fato', 'vs'], never: ['foto de perfil', 'logo', 'capa', 'assinatura do canal'], disclose_ai: true, resemble_real_people: false },\n        framing: { height_pct: [30, 36], align: 'right', crop: 'chest-up', background: 'transparent cutout', frame_or_box: false, exits_last_seconds: 3, text_side: 'opposite' },\n        consistency: { locked_prompt: true, fixed_seed: true, master_refs: ['frontal', '3/4', 'perfil'], variables_per_video: ['angulo', 'expressao', 'gesto'] },\n        cast: [\n          { id: 'iris', name: 'Íris', role: 'notícia e análise', gender: 'feminino', seed: 481502, accent_light: '#39FF88',\n            voice: { lang: 'pt-BR', pitch: 'médio-grave', rate: 0.95, note: 'pausa após o gancho' }, identity_prompt: av.iris },\n          { id: 'theo', name: 'Théo', role: 'tutorial e comparação', gender: 'masculino', seed: 907314, accent_light: '#39FF88',\n            voice: { lang: 'pt-BR', pitch: 'grave', rate: 1.0, note: 'ênfase nos números' }, identity_prompt: av.theo }\n        ],\n        variation_prompt: av.varia,\n        negative_prompt: av.neg\n      },\n      prompts: { image: p.img, image_negative: p.neg, script_system: p.voice, caption: p.cap }\n    }, null, 2);\n  }\n\n  renderVals() {\n    const pillars = this.data();\n    const i = this.state.pillar;\n    const sel = pillars[i];\n    const p = this.prompts();\n    const av = this.avatars();\n    const brandJson = this.json(p, av);\n    const lbl = (k, d) => this.state.copied === k ? 'COPIADO' : d;\n    return {\n      showAgent: this.props.showAgentSpecs ?? true,\n      bios: this.bioList(),\n      bioMain: (this.bioList().find(b => b.key === (this.props.bioTone ?? 'enigmática')) || this.bioList()[0]).text,\n      pillars: pillars.map((x, n) => Object.assign({}, x, {\n        select: () => this.setState({ pillar: n }),\n        chipStyle: 'font:600 11px \"IBM Plex Mono\",monospace;letter-spacing:0.09em;padding:9px 15px;border-radius:999px;cursor:pointer;transition:all .15s;background:' +\n          (n === i ? x.accent : 'transparent') + ';color:' + (n === i ? '#0a0a0c' : '#8b93a1') +\n          ';border:1px solid ' + (n === i ? x.accent : 'rgba(255,255,255,0.16)')\n      })),\n      sel: Object.assign({}, sel, {\n        beats: sel.beats.map((t, n) => ({ n: String(n + 1).padStart(2, '0'),

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar deps (inclui grupo dev)
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: "Pytest hermetico (sem testes de rede/mp4 local)"
        run: >-
          uv run pytest -q
          --deselect tests/test_photos.py::TestPexels::test_cache_evita_rede
          --deselect tests/test_autopilot.py::TestApresentadorNoSlot::test_pilar_com_clipe_base_pede_o_clipe_e_nao_o_retrato

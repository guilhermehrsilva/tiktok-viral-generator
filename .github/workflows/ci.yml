name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar deps (inclui grupo dev)
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
